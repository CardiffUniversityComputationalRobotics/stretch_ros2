/**/stretch_dex_wrist_controller:
  ros__parameters:

    type: joint_trajectory_controller/JointTrajectoryController

    joints:
      - joint_wrist_pitch
      - joint_wrist_roll

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: true

    action_monitor_rate: 10.0

    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 0.05

      joint_wrist_pitch:
        trajectory: 0.1
        goal: 0.1

      joint_wrist_roll:
        trajectory: 0.1
        goal: 0.1